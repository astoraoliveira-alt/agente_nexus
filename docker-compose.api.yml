services:
  porteiro:
    build: 
      context: ./porteiro
      dockerfile: Dockerfile
    container_name: nexus-porteiro
    restart: always
    env_file:
      - ./porteiro/.env
    # No ports needed if it's just a queue consumer, 
    # but Hono server suggests it might have healthchecks.
    networks:
      - n8n-traefik_app_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexus-porteiro.rule=Host(`api.davosconsulting.com.br`)"
      - "traefik.http.routers.nexus-porteiro.entrypoints=websecure"
      - "traefik.http.routers.nexus-porteiro.tls.certresolver=letsencrypt" # Comum em n8n-traefik setups
      - "traefik.http.services.nexus-porteiro.loadbalancer.server.port=3001"

networks:
  n8n-traefik_app_network:
    external: true
